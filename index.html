<style>
:root{--bg:#06100d;--bg2:#0b1b15;--panel:#10251d;--panel2:#173229;--text:#f5f5ec;--muted:#a9bbb1;--line:#2d4a40;--glow:#eef7a9;--glow2:#c9df73;--warm:#f1e6a7;--orange:#e6a36e;--shadow:rgba(0,0,0,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050d0a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 0,rgba(71,110,83,.2),transparent 28%),#050d0a}
button{font:inherit}.app{width:min(100%,560px);min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#081610,#050d0a 70%);box-shadow:0 0 100px rgba(0,0,0,.32)}
.screen{min-height:100vh;padding:20px 18px 132px;animation:enter .38s ease}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;position:sticky;top:0;z-index:20;padding:8px 0 10px;background:linear-gradient(180deg,rgba(6,16,13,.98),rgba(6,16,13,.78),transparent);font-size:12px;color:var(--muted)}
.top .mid{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.back{border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;padding:4px 0}.num{text-align:right}.bar{height:3px;background:#173027;border-radius:4px;margin:-4px 0 20px;overflow:hidden}.bar i{height:100%;display:block;background:var(--glow2);transition:.35s}
h1,h2,h3,p{margin-top:0}h1{font-size:40px;line-height:1.12;margin-bottom:12px}h2{font-size:28px;line-height:1.35;margin-bottom:14px}h3{font-size:18px;color:var(--warm);line-height:1.45;margin-bottom:9px}p{font-size:16px;line-height:1.82}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--glow2);text-transform:uppercase;margin-bottom:10px}
.hero{min-height:68vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.glow{width:18px;height:18px;border-radius:50%;background:var(--glow);box-shadow:0 0 17px 7px rgba(238,247,169,.42),0 0 65px 28px rgba(238,247,169,.08);animation:pulse 2.3s infinite;margin:24px}@keyframes pulse{0%,100%{transform:scale(.88);opacity:.78}50%{transform:scale(1.17);opacity:1}}
.card{background:linear-gradient(180deg,rgba(18,43,34,.97),rgba(10,26,20,.97));border:1px solid var(--line);border-radius:22px;padding:19px;margin:14px 0;box-shadow:0 16px 44px var(--shadow)}.quote{border-left:2px solid var(--glow2);padding:3px 0 3px 14px;color:var(--warm);font-size:18px;line-height:1.7;margin:20px 0}.bigq{font-size:27px;line-height:1.48;text-align:center;color:var(--warm);margin:29px 0}
.cta{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);padding:16px 18px 22px;background:linear-gradient(180deg,transparent,rgba(6,16,13,.95) 26%,#06100d 60%)}.primary,.secondary{width:100%;padding:16px 18px;border-radius:16px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--glow);color:#132015;box-shadow:0 0 22px rgba(238,247,169,.15)}.primary:disabled{opacity:.32;cursor:not-allowed}.secondary{margin-top:9px;background:#13291f;color:var(--text);border:1px solid var(--line)}
.visual{height:215px;border:1px solid var(--line);border-radius:23px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden;background:radial-gradient(circle at center,rgba(238,247,169,.06),transparent 58%),#091812}.visual.lines:before,.visual.lines:after{content:"";position:absolute;width:145%;height:2px;background:#7f9d8e;opacity:.45;transform:rotate(19deg)}.visual.lines:after{transform:rotate(-27deg);top:68%}.visual.spot{background:radial-gradient(circle at 50% 22%,rgba(238,247,169,.52) 0 8%,rgba(238,247,169,.13) 18%,transparent 42%),#050d0a}.visual.room{background:linear-gradient(180deg,#192720,#0a110e)}.visual.archive{background:linear-gradient(135deg,#20231d,#09110e)}.visual.stage{background:radial-gradient(circle at 50% 10%,rgba(238,247,169,.25),transparent 38%),#070e0c}.visual.future{background:linear-gradient(135deg,#17312e,#121825 45%,#271836)}.huge{font-size:54px}
.memvideo{display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:23px;margin-bottom:20px;background:#000;object-fit:cover}
.pills{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.pill{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#0d1f18;color:var(--muted);font-size:13px}.action{display:inline-block;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--glow2);font-size:13px}
/* game hud */
.game-hud{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}.quest{font-size:14px;color:var(--muted);line-height:1.55}.badge{font-size:12px;color:#182116;background:var(--glow2);border-radius:999px;padding:5px 9px;font-weight:800}.hint{text-align:center;color:var(--muted);font-size:15px;line-height:1.65;margin:8px 0 15px}.instruction{border:1px solid rgba(201,223,115,.38);background:rgba(201,223,115,.07);border-radius:16px;padding:13px 15px;margin:10px 0 17px;font-size:15px;line-height:1.65;color:var(--text)}.instruction b{color:var(--glow)}.gamebox{border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#0c1e17,#07130f);min-height:370px;position:relative;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.16);margin:8px 0 18px}
/* q1 web */
.web{height:390px}.web svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.web line{stroke:#42685a;stroke-width:1.5;transition:.5s}.web line.cut{stroke:#815f54;opacity:.13}.webnode{position:absolute;width:76px;height:76px;border-radius:50%;border:1px solid #3b6254;background:#112a21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;cursor:pointer;transition:.3s;box-shadow:0 6px 22px rgba(0,0,0,.25)}.webnode b{font-size:24px}.webnode:hover{transform:scale(1.04)}.webnode.cut{opacity:.22;filter:grayscale(1);transform:scale(.9)}.webnode.affected{border-color:#9b7e56;animation:shake .35s 2}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* q2 spotlight */
.spotgame{height:400px;background:#020806}.spotlight-orb{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(238,247,169,.48),rgba(238,247,169,.14) 38%,transparent 68%);transform:translate(-50%,-50%);transition:.38s;pointer-events:none;filter:blur(.2px)}.organism{position:absolute;width:88px;height:88px;border-radius:18px;border:1px solid #273b34;background:#07130f;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.28s;padding:7px;font-size:13px;line-height:1.35}.organism b{font-size:27px}.organism.lit{color:var(--text);border-color:var(--glow2);background:#163127;transform:scale(1.07)}.coin{position:absolute;right:14px;top:14px;background:#f0d67d;color:#2d2511;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px rgba(240,214,125,.25);z-index:3}.coin.spent{animation:coinfly .6s both}@keyframes coinfly{to{transform:scale(.3);opacity:0}}
/* q3 timeline */
.chart{height:210px;position:relative;margin:16px}.chart svg{width:100%;height:100%}.chart polyline{fill:none;stroke:var(--glow2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart circle{fill:var(--glow);stroke:#172218;stroke-width:3}.yearout{text-align:center;font-size:42px;color:var(--warm);font-weight:800}.popout{text-align:center;color:var(--muted)}.range{width:100%;accent-color:#c9df73}.pressure{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 18px}.pressure div{border:1px solid var(--line);background:#10241c;border-radius:13px;padding:11px;font-size:14px}.strategy-grid{display:grid;gap:10px;margin-top:13px}.strategy{border:1px solid var(--line);background:#10241c;color:var(--text);border-radius:15px;padding:15px 16px;text-align:left;cursor:pointer;font-size:16px;line-height:1.45}.strategy.on{border-color:var(--glow2);background:#19352a}.strategy small{display:block;color:var(--muted);margin-top:5px;font-size:14px;line-height:1.5}
/* q4 archaeology */
.digsite{height:410px;background:linear-gradient(#10211b 0 30%,#4a3c2b 30% 48%,#382d21 48% 68%,#2c231b 68%);position:relative}.layerlabel{position:absolute;right:10px;font-size:10px;color:rgba(255,255,255,.45)}.artifact{position:absolute;width:62px;height:62px;border-radius:50%;border:1px dashed rgba(255,255,255,.25);background:rgba(7,14,11,.38);display:flex;align-items:center;justify-content:center;font-size:27px;cursor:pointer;filter:brightness(.5);transition:.3s}.artifact.found{filter:none;border:1px solid var(--glow2);background:#163026;box-shadow:0 0 18px rgba(238,247,169,.16);transform:scale(1.08)}.foundbar{display:flex;gap:7px;justify-content:center;margin:10px}.founddot{width:10px;height:10px;border-radius:50%;background:#213b31}.founddot.on{background:var(--glow2);box-shadow:0 0 8px var(--glow2)}
/* q5 stage */
.stagebox{height:410px;background:linear-gradient(#07120e,#030806);position:relative}.stagefloor{position:absolute;left:8%;right:8%;bottom:40px;height:120px;background:linear-gradient(180deg,#19241f,#090e0c);clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);border-top:1px solid #48574f}.stagebeam{position:absolute;left:50%;top:-15px;width:260px;height:365px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(238,247,169,.26),rgba(238,247,169,.03) 75%,transparent);clip-path:polygon(44% 0,56% 0,92% 100%,8% 100%);pointer-events:none}.director{position:absolute;left:50%;bottom:67px;transform:translateX(-50%);font-size:13px;color:var(--warm);text-align:center}.rolechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:11px 0}.rolechip{border:1px solid var(--line);background:#10241c;color:var(--text);padding:12px 14px;border-radius:14px;cursor:pointer;font-size:16px;line-height:1.4}.rolechip.on{border-color:var(--glow2);background:#19382c;box-shadow:0 0 14px rgba(238,247,169,.1)}.stageactors{position:absolute;inset:50px 30px 140px;display:flex;align-items:flex-end;justify-content:space-around;font-size:34px}.stageactors span{opacity:.36;transition:.35s}.stageactors span.on{opacity:1;transform:translateY(28px) scale(1.25);filter:drop-shadow(0 0 10px rgba(238,247,169,.25))}
/* q6 postcard */
.postcard{background:#e9e2cf;color:#263029;border-radius:21px;padding:20px;min-height:310px;transform:rotate(-1deg);box-shadow:0 18px 45px rgba(0,0,0,.3);margin:12px 0}.postcard h2,.postcard h3,.postcard p{color:#263029}.stampbox{float:right;width:82px;height:96px;border:2px dashed #8c725b;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:5px}.stampbox.filled{font-size:31px;border-style:solid;background:#f4edda;animation:stamp .35s}@keyframes stamp{50%{transform:scale(1.15) rotate(-4deg)}}.stampchoices{display:flex;gap:8px;overflow-x:auto;padding:7px 2px 12px}.stampchoice{min-width:112px;border:1px solid var(--line);background:#10241c;color:var(--text);border-radius:15px;padding:13px 12px;text-align:center;cursor:pointer;font-size:15px;line-height:1.35}.stampchoice.on{border-color:var(--glow2);background:#19352a}.stampchoice b{display:block;font-size:28px}.fly{animation:fly 1.2s forwards}@keyframes fly{to{transform:translate(140px,-240px) rotate(12deg) scale(.28);opacity:0}}

/* answer choices */
.choices{display:grid;gap:10px;margin:14px 0 24px}.choice{width:100%;border:1px solid var(--line);background:#10241c;color:var(--text);border-radius:15px;padding:15px 16px;text-align:left;cursor:pointer;font-size:16px;line-height:1.5}.choice:hover{border-color:var(--glow2);background:#173128}.choice strong{font-size:16px}
/* result */
.roleicon{text-align:center;font-size:68px;margin:15px 0 0}.rolename{text-align:center;font-size:33px;font-weight:900}.roletag{text-align:center;color:var(--glow2);font-weight:800;margin:5px 0 20px}.miniroles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.minirole{font-size:12px;padding:7px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.firefly{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 3px rgba(238,247,169,.4);pointer-events:none;opacity:.55;animation:float 7s infinite ease-in-out;z-index:1}@keyframes float{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(18px,-42px);opacity:.8}}

/* raffle registration */
.formgrid{display:grid;gap:12px;margin:16px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;border:1px solid var(--line);background:#0d2119;color:var(--text);border-radius:14px;padding:14px 15px;font-size:16px;outline:none}
.field input:focus{border-color:var(--glow2);box-shadow:0 0 0 3px rgba(201,223,115,.08)}
.consent{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#0d1f18;border-radius:14px;padding:13px;margin:12px 0;color:var(--muted);font-size:13px;line-height:1.6}
.consent input{margin-top:3px;accent-color:#c9df73}
.routebox{display:grid;gap:8px;margin:14px 0}
.routeitem{display:grid;grid-template-columns:44px 1fr;gap:9px;align-items:start;border-bottom:1px dashed rgba(169,187,177,.18);padding:9px 0}
.routeitem b{color:var(--glow2);font-size:12px}
.routeitem span{font-size:14px;line-height:1.5}
.notice{font-size:12px;color:var(--muted);line-height:1.65}
.successmark{text-align:center;font-size:58px;margin:20px 0 10px}

.app{width:min(100%,760px);border-left:1px solid #13271f;border-right:1px solid #13271f}

<body>
<div class="app" id="app"></div>
<script>
const TIME_MAIL_URL=""; // 將正式「時光郵局寄給未來的信」網址貼在引號內
const SUBMIT_URL="https://script.google.com/macros/s/AKfycbwJrx4Q6sxrlwvnddqA2I3qVvPP4Qv4jRM9kY4ZA3uFvVuWM54zgDtXiMWuxHo652tf/exec"; // Google Apps Script 抽獎資料後台
const DRAW_COUNT=15;
const roles={
"磯永吉小屋":{e:"🏠",tag:"你是記得的人",txt:"你容易注意時間留下的痕跡。對你來說，一棟老房子不只是建築，而是一段仍存在於現在的記憶。你提醒我們：新的事物很重要，但知道自己從哪裡來，也很重要。"},
"瑠公圳":{e:"💧",tag:"你是尋找隱藏連結的人",txt:"很多重要的事情不一定看得見。水可能藏到地下，歷史可能藏進城市。你會去尋找那些仍然默默連接一切的線。"},
"農田":{e:"🌾",tag:"你是共生的人",txt:"你不太想把人與自然分成兩邊。農場可以生產、研究、教育，也可以同時成為其他生命的家。你會問：我們怎麼一起生活？"},
"田心房":{e:"☕",tag:"你是讓事物重新活一次的人",txt:"你接受改變，但改變不一定代表抹掉過去。舊建築可以得到新用途，一個空間也可以重新找到自己的位置。"},
"人工氣候室":{e:"🔬",tag:"你是願意動手改變的人",txt:"當環境出現問題，你傾向問：我們能做什麼？研究、科技、設計與管理，都可能成為回應環境問題的方法。"},
"考種館":{e:"🌱",tag:"你是替未來準備的人",txt:"一顆種子很小，但裡面可能藏著整片田地的未來。你做決定時，很容易想到：現在的選擇，會替下一個世代留下什麼？"},
"土壤館":{e:"🟫",tag:"你是看見基礎的人",txt:"你容易注意那些沒有人鼓掌，卻讓整個系統得以存在的東西。土壤、分解者、微生物通常不在聚光燈下，卻支撐許多生命。"},

function routeItems(){
  return ["q1","q2","q3","q4","q5","q6"].map((q,i)=>{
    const code=s.answers[q]||"";
    return {q,step:i+1,code,label:(optionLabels[q]&&optionLabels[q][code])||"未作答"};
  });
}
function routeCode(){return routeItems().map(x=>x.code||"-").join("-")}
function routeText(){return routeItems().map(x=>`${x.q.toUpperCase()} ${x.label}`).join(" → ")}
function routeHTML(){
  return routeItems().map(x=>`<div class="routeitem"><b>Q${x.step}</b><span>${x.label}</span></div>`).join("");
}
async function submitRaffle(){
  const name=(document.getElementById("raffleName")?.value||"").trim();
  const contact=(document.getElementById("raffleContact")?.value||"").trim();
  const consent=!!document.getElementById("raffleConsent")?.checked;
  const honey=(document.getElementById("raffleWebsite")?.value||"").trim();
  if(!name){alert("請填寫姓名或暱稱。");return}
  if(!contact){alert("請留下至少一種可聯絡方式。");return}
  if(!consent){alert("請先勾選同意抽獎與聯絡資訊使用說明。");return}
  if(honey)return;
  if(!SUBMIT_URL){
    alert("目前是預覽模式：尚未連接抽獎資料後台。請先把 Google Apps Script 的 /exec 網址填入 SUBMIT_URL。");
    return;
  }
  const winner=scoreResult();
  const payload={
    participant_id:s.pid,
    submitted_at:new Date().toISOString(),
    name,
    contact,
    result_role:winner,
    route_code:routeCode(),
    route_text:routeText(),
    q1_code:s.answers.q1||"",q1_choice:optionLabels.q1[s.answers.q1]||"",
    q2_code:s.answers.q2||"",q2_choice:optionLabels.q2[s.answers.q2]||"",
    q3_code:s.answers.q3||"",q3_choice:optionLabels.q3[s.answers.q3]||"",
    q4_code:s.answers.q4||"",q4_choice:optionLabels.q4[s.answers.q4]||"",
    q5_code:s.answers.q5||"",q5_choice:optionLabels.q5[s.answers.q5]||"",
    q6_code:s.answers.q6||"",q6_choice:optionLabels.q6[s.answers.q6]||"",
    user_agent:navigator.userAgent
  };
  const btn=document.getElementById("raffleSubmit");
  if(btn){btn.disabled=true;btn.textContent="送出中…"}
  try{
    await fetch(SUBMIT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload)
    });
    s.raffleSubmitted=true;save();nav("raffleDone");
  }catch(err){
    if(btn){btn.disabled=false;btn.textContent="送出抽獎登記"}
    alert("送出失敗，請確認網路連線後再試一次。");
  }
}
